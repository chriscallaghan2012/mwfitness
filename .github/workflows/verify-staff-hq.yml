name: Staff HQ scaffold verification

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/staff-hq-coaching-content.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-staff-hq.yml"
  push:
    branches:
      - feat/staff-hq-coaching-content
    paths:
      - "src/**"
      - "docs/staff-hq-coaching-content.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-staff-hq.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build

name: MW Fitness Website — Full Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mw-fitness-website-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, TypeScript and production build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript and lint checks
        run: npm run lint
      - name: Production build
        run: npm run build

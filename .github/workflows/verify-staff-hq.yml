name: Staff HQ verification

on:
  workflow_dispatch:
  push:
    branches:
      - work/mwfitness-routes-hero-stripes-neon

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint and type checks
        run: npm run lint
      - name: Production build
        run: npm run build

name: Neon dependency and build check

on:
  push:
    branches:
      - chore/neon-shared-backend
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/neon-shared-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve dependencies and refresh lockfile
        run: npm install --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Neon dependency lockfile"
            git push origin HEAD:chore/neon-shared-backend
          fi
